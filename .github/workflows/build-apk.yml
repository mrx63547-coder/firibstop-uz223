name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Run tests
        run: npm test

      - name: Install Capacitor
        run: npm install --no-save --no-package-lock @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6

      - name: Prepare web files
        run: node scripts/prepare-www.js

      - name: Create Android project
        run: npx cap add android

      - name: Launcher icons
        run: |
          pip install pillow
          python3 scripts/make-android-icons.py

      - name: Sync web files into Android project
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Collect APK
        run: |
          mkdir -p build-out
          cp android/app/build/outputs/apk/debug/app-debug.apk build-out/FiribStop.apk

      - uses: actions/upload-artifact@v4
        with:
          name: FiribStop-apk
          path: build-out/FiribStop.apk
          if-no-files-found: error
